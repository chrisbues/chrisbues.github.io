{{- if .Params.gridjs -}}
<!-- Grid.js Resources - Only loaded when gridjs: true in front matter -->
<link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
<script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>

<style>
/* ============================================
   Grid.js Hextra Theme Integration
   Overrides mermaid theme to match Hextra styling
   ============================================ */

/* Wrapper - contains title and table together */
.gridjs-hextra-wrapper {
  margin: 1.5rem 0;
}

/* Container */
.gridjs-container {
  font-family: inherit;
  width: 100% !important;
}

/* Table title - matches Hextra h3 styling */
.gridjs-table-title {
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 1.75rem;
  margin-top: 0;
  margin-bottom: 0.5rem;
  color: rgb(17 24 39);
  text-align: left;
}

:is(.dark .gridjs-table-title) {
  color: rgb(245 245 245);
}

/* Wide table - breaks out of Hextra's content container */
.gridjs-hextra-wide {
  width: 80vw !important;
  max-width: 80vw !important;
  margin-left: calc(50% - 40vw) !important;
  margin-right: calc(50% - 40vw) !important;
  position: relative;
  left: 0;
  right: 0;
}

/* Extra wide - 95% of viewport */
.gridjs-hextra-fullwidth {
  width: 95vw !important;
  max-width: 95vw !important;
  margin-left: calc(50% - 47.5vw) !important;
  margin-right: calc(50% - 47.5vw) !important;
  position: relative;
  left: 0;
  right: 0;
}

/* Wrapper - enables horizontal scroll for wide tables */
.gridjs-wrapper {
  border-radius: 0.5rem;
  border: 1px solid rgb(229 231 235);
  overflow-x: auto;
  background-color: white;
  width: 100% !important;
}

:is(.dark .gridjs-wrapper) {
  border-color: rgb(64 64 64);
  background-color: rgb(23 23 23);
}

/* Table */
.gridjs-table {
  border-collapse: collapse;
  width: 100% !important;
  font-size: 0.875rem;
  line-height: 1.5rem;
}

/* Header cells */
.gridjs-th {
  background-color: rgb(249 250 251) !important;
  font-weight: 600 !important;
  text-align: left !important;
  padding: 0.75rem 1rem !important;
  border-bottom: 1px solid rgb(229 231 235) !important;
  color: rgb(17 24 39) !important;
  white-space: normal !important;
  word-break: keep-all !important;
  overflow-wrap: normal !important;
}

/* Header content wrapper - allow wrapping at spaces only */
.gridjs-th-content {
  white-space: normal !important;
  overflow: visible !important;
  text-overflow: clip !important;
  word-break: keep-all !important;
  overflow-wrap: normal !important;
}

:is(.dark .gridjs-th) {
  background-color: rgb(38 38 38) !important;
  border-color: rgb(64 64 64) !important;
  color: rgb(245 245 245) !important;
}

/* Sortable headers */
.gridjs-th-sort {
  cursor: pointer;
  user-select: none;
  transition: background-color 0.15s;
}

.gridjs-th-sort:hover {
  background-color: rgb(243 244 246);
}

:is(.dark .gridjs-th-sort:hover) {
  background-color: rgb(64 64 64);
}

/* Sort button styling */
button.gridjs-sort {
  background: none;
  border: none;
  padding: 0;
  margin-left: 0.5rem;
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.15s;
}

button.gridjs-sort:hover {
  opacity: 1;
}

.gridjs-sort-asc, .gridjs-sort-desc {
  opacity: 1;
}

/* Body cells */
.gridjs-td {
  padding: 0.75rem 1rem !important;
  border-bottom: 1px solid rgb(229 231 235) !important;
  color: rgb(55 65 81) !important;
  background-color: white !important;
  text-align: left !important;
  white-space: normal !important;
  word-break: keep-all !important;
  overflow-wrap: normal !important;
}

/* Ensure first column matches other columns */
.gridjs-td:first-child {
  text-align: left !important;
  padding: 0.75rem 1rem !important;
}

:is(.dark .gridjs-td) {
  border-color: rgb(64 64 64) !important;
  color: rgb(212 212 212) !important;
  background-color: rgb(23 23 23) !important;
}

/* Links within cells */
.gridjs-td a {
  color: rgb(37 99 235);
  text-decoration: none;
  transition: color 0.15s;
}

.gridjs-td a:hover {
  color: rgb(29 78 216);
  text-decoration: underline;
}

:is(.dark .gridjs-td a) {
  color: rgb(96 165 250);
}

:is(.dark .gridjs-td a:hover) {
  color: rgb(147 197 253);
}

/* Code in cells */
.gridjs-td code {
  background-color: rgb(243 244 246);
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
  font-size: 0.8125rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

:is(.dark .gridjs-td code) {
  background-color: rgb(38 38 38);
}

/* Alternating rows */
.gridjs-tr:nth-child(even) .gridjs-td {
  background-color: rgb(249 250 251) !important;
}

:is(.dark .gridjs-tr:nth-child(even) .gridjs-td) {
  background-color: rgb(30 30 30) !important;
}

/* Row hover */
.gridjs-tr:hover .gridjs-td {
  background-color: rgb(243 244 246) !important;
}

:is(.dark .gridjs-tr:hover .gridjs-td) {
  background-color: rgb(38 38 38) !important;
}

/* Search input */
.gridjs-search {
  margin-bottom: 1rem !important;
  display: flex !important;
  justify-content: flex-end !important;
}

.gridjs-search-input {
  width: auto !important;
  min-width: 15rem !important;
  max-width: 20rem !important;
  padding: 0.5rem 0.75rem;
  font-size: 0.875rem;
  border: 1px solid rgb(209 213 219);
  border-radius: 0.5rem;
  outline: none;
  background-color: white;
  color: rgb(17 24 39);
  transition: border-color 0.15s, box-shadow 0.15s;
}

.gridjs-search-input::placeholder {
  color: rgb(156 163 175);
}

.gridjs-search-input:focus {
  border-color: rgb(59 130 246);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

:is(.dark .gridjs-search-input) {
  background-color: rgb(38 38 38);
  border-color: rgb(64 64 64);
  color: rgb(245 245 245);
}

:is(.dark .gridjs-search-input::placeholder) {
  color: rgb(115 115 115);
}

:is(.dark .gridjs-search-input:focus) {
  border-color: rgb(96 165 250);
  box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
}

/* Pagination container */
.gridjs-pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 0;
  font-size: 0.875rem;
  color: rgb(107 114 128);
  flex-wrap: wrap;
  gap: 0.5rem;
  background-color: transparent;
}

:is(.dark .gridjs-pagination) {
  color: rgb(163 163 163);
  background-color: transparent;
}

/* Pagination summary */
.gridjs-summary {
  order: 1;
  background-color: transparent;
}

:is(.dark .gridjs-summary) {
  background-color: transparent;
  color: rgb(163 163 163);
}

/* Pagination buttons container */
.gridjs-pages {
  display: flex;
  gap: 0.25rem;
  order: 2;
  background-color: transparent;
}

:is(.dark .gridjs-pages) {
  background-color: transparent;
}

.gridjs-pages button {
  padding: 0.375rem 0.75rem;
  border: 1px solid rgb(209 213 219);
  border-radius: 0.375rem;
  background-color: white;
  color: rgb(55 65 81);
  cursor: pointer;
  transition: background-color 0.15s, border-color 0.15s;
  font-size: 0.875rem;
}

.gridjs-pages button:hover:not(:disabled) {
  background-color: rgb(243 244 246);
  border-color: rgb(156 163 175);
}

.gridjs-pages button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.gridjs-pages button.gridjs-currentPage {
  background-color: rgb(59 130 246);
  border-color: rgb(59 130 246);
  color: white;
}

:is(.dark .gridjs-pages button) {
  background-color: rgb(38 38 38);
  border-color: rgb(64 64 64);
  color: rgb(212 212 212);
}

:is(.dark .gridjs-pages button:hover:not(:disabled)) {
  background-color: rgb(64 64 64);
  border-color: rgb(82 82 82);
}

:is(.dark .gridjs-pages button.gridjs-currentPage) {
  background-color: rgb(59 130 246);
  border-color: rgb(59 130 246);
  color: white;
}

/* Override any default Grid.js pagination styles */
.gridjs-pagination::after,
.gridjs-pagination::before {
  display: none;
}

/* Footer (where pagination lives) */
.gridjs-footer {
  border-top: 1px solid rgb(229 231 235);
  background-color: rgb(249 250 251);
  padding: 0 1rem;
  border-radius: 0 0 0.5rem 0.5rem;
}

:is(.dark .gridjs-footer) {
  border-color: rgb(64 64 64);
  background-color: rgb(30 30 30);
}

/* Ensure no white backgrounds leak through in dark mode */
:is(.dark .gridjs-footer *) {
  background-color: inherit;
}

/* Header container (where search lives) */
.gridjs-head {
  padding: 0;
  background-color: transparent;
}

:is(.dark .gridjs-head) {
  background-color: transparent;
}

/* Loading bar */
.gridjs-loading-bar {
  background-color: rgb(59 130 246);
}

/* Empty/Not found state */
.gridjs-notfound {
  padding: 3rem 1rem;
  text-align: center;
  color: rgb(107 114 128);
}

:is(.dark .gridjs-notfound) {
  color: rgb(163 163 163);
}

/* Error state */
.gridjs-error {
  padding: 1rem;
  color: rgb(185 28 28);
  background-color: rgb(254 242 242);
  border-radius: 0.5rem;
}

:is(.dark .gridjs-error) {
  color: rgb(252 165 165);
  background-color: rgb(69 26 26);
}

/* ============================================
   Wrapping Control Classes
   ============================================ */

/* No wrapping - single line */
.gridjs-nowrap {
  white-space: nowrap;
}

/* Normal word wrap */
.gridjs-wrap {
  white-space: normal;
  word-wrap: break-word;
}

/* Break anywhere including mid-word */
.gridjs-wrap-break {
  white-space: normal;
  word-break: break-all;
}

/* Preserve whitespace formatting */
.gridjs-wrap-pre {
  white-space: pre-wrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.8125rem;
}

/* Truncate with ellipsis */
.gridjs-truncate {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  display: inline-block;
}

/* Constrained width with wrap */
.gridjs-constrained {
  max-width: 300px;
  white-space: normal;
  word-wrap: break-word;
  display: inline-block;
}

/* ============================================
   Resizable column styling
   ============================================ */

.gridjs-resizable {
  position: relative;
}

.gridjs-resizable:after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  cursor: col-resize;
}

/* ============================================
   Fixed header styling  
   ============================================ */

.gridjs-wrapper.gridjs-fixedHeader {
  overflow-y: auto;
}

.gridjs-wrapper.gridjs-fixedHeader .gridjs-thead {
  position: sticky;
  top: 0;
  z-index: 10;
}

/* ============================================
   Override Grid.js default theme (mermaid)
   ============================================ */

/* Reset any theme backgrounds in dark mode */
:is(.dark .gridjs-container),
:is(.dark .gridjs-head),
:is(.dark .gridjs-body),
:is(.dark .gridjs-pagination) {
  background-color: transparent;
}

/* Ensure table cells have consistent alignment */
.gridjs-th,
.gridjs-td {
  text-align: left;
}

/* Fix th content wrapper alignment */
.gridjs-th-content {
  text-align: left;
  display: inline-block;
  width: 100%;
}

/* Override mermaid theme pagination button styling */
:is(.dark) button.gridjs-spread {
  background-color: rgb(38 38 38) !important;
  border-color: rgb(64 64 64) !important;
  color: rgb(212 212 212) !important;
}

:is(.dark) .gridjs-pagination .gridjs-pages button {
  background-color: rgb(38 38 38) !important;
  border-color: rgb(64 64 64) !important;
  color: rgb(212 212 212) !important;
}

:is(.dark) .gridjs-pagination .gridjs-pages button:hover:not(:disabled) {
  background-color: rgb(64 64 64) !important;
}

:is(.dark) .gridjs-pagination .gridjs-pages button.gridjs-currentPage {
  background-color: rgb(59 130 246) !important;
  border-color: rgb(59 130 246) !important;
  color: white !important;
}
</style>

<script>
// Fix Grid.js styling after render
(function() {
  function fixGridStyles() {
    // Fix cell padding
    document.querySelectorAll('.gridjs-th, .gridjs-td').forEach(function(cell) {
      cell.style.padding = '0.75rem 1rem';
    });
    // Fix header text wrapping - only at spaces, not mid-word
    document.querySelectorAll('.gridjs-th, .gridjs-th-content').forEach(function(el) {
      el.style.whiteSpace = 'normal';
      el.style.wordBreak = 'keep-all';
      el.style.overflowWrap = 'normal';
      el.style.overflow = 'visible';
      el.style.textOverflow = 'clip';
    });
    // Fix body cell text wrapping - only at spaces, not mid-word
    document.querySelectorAll('.gridjs-td').forEach(function(el) {
      el.style.whiteSpace = 'normal';
      el.style.wordBreak = 'keep-all';
      el.style.overflowWrap = 'normal';
    });
    // Fix search box alignment - move to right side
    document.querySelectorAll('.gridjs-search').forEach(function(el) {
      el.style.display = 'flex';
      el.style.justifyContent = 'flex-end';
    });
  }
  
  // Run on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(fixGridStyles, 100);
    });
  } else {
    setTimeout(fixGridStyles, 100);
  }
  
  // Also observe for dynamically added tables
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.addedNodes.length) {
        setTimeout(fixGridStyles, 50);
      }
    });
  });
  
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
{{- end -}}
