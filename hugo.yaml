baseURL: https://chrisbues.com/
languageCode: en-us
title: Chris Bues

module:
  imports:
    - path: github.com/imfing/hextra
    - path: github.com/hugomods/icons/vendors/bootstrap
    - path: github.com/hugomods/icons/vendors/font-awesome
    - path: github.com/hugomods/icons/vendors/lucide

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

menu:
  main:
    - name: M365
      pageRef: /docs/m365
      weight: 1
    - name: Purview
      pageRef: /docs/purview
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: LinkedIn
      weight: 5
      url: "https://www.linkedin.com/in/chrisbues/"
      params:
        icon: linkedin
    - name: GitHub
      weight: 6
      url: "https://github.com/chrisbues"
      params:
        icon: github

markup:
  goldmark:
    renderer:
      unsafe: true

enableGitInfo: true

params:
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: full
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/square-library.svg
      link: /
    width: wide
  externalLinkDecoration: true
  contextMenu:
    enable: true
    links:
      - name: Open in ChatGPT
        icon: chatgpt
        url: "https://chatgpt.com/?hints=search&q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."
      - name: Open in Claude
        icon: claude
        url: "https://claude.ai/new?q=I%27m+looking+at+this+documentation%3A+{url}%0AHelp+me+understand+how+to+use+it."

  blog:
    list:
      displayTags: true
  toc:
    displayTags: true
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  editURL:
    enable: false
    base: "https://github.com/chrisbues/chrisbues.github.io/edit/main"

enableEmoji: true
enableInlineShortcodes: true